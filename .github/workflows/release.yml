name: release

# On a published release: build fmsg-mcp for every supported platform (with
# the fmsg CLI it drives embedded), package signed Claude Desktop extension
# bundles (.mcpb) for the platforms Desktop supports, and attach them to the
# release. Only two artifact kinds are published — .mcpb bundles for Claude
# Desktop and fmsg-mcp_<os>_<arch> binaries for Claude Code installs (the
# README's install prompt downloads the right one); the fmsg CLI is embedded,
# never published standalone (it has its own releases).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for"
        required: true

permissions:
  contents: write

env:
  # fmsg-cli ref to bundle; must include the --json and whoami commands.
  FMSG_CLI_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve tag and version
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Clone fmsg-cli
        run: git clone --depth 1 --branch "$FMSG_CLI_REF" https://github.com/markmnl/fmsg-cli /tmp/fmsg-cli

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist internal/cli/embedded
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${p%/*}" goarch="${p#*/}" ext=""
            [ "$goos" = windows ] && ext=".exe"
            # Build the CLI for this platform and embed it into fmsg-mcp so
            # users need a single download; the CLI is not published standalone.
            (cd /tmp/fmsg-cli && CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/internal/cli/embedded/fmsg-bin" .)
            # Stamp the release tag (sans leading v) as the reported version.
            # $VERSION, not GITHUB_REF_NAME: on workflow_dispatch re-runs the
            # ref is the branch, which would stamp "main" as the version.
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -tags embedcli -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/fmsg-mcp_${goos}_${goarch}${ext}" .
          done
          ls -l dist

      - name: Assemble Claude Desktop bundles (.mcpb)
        run: |
          set -euo pipefail
          # platform label : goos : goarch : exe suffix
          for spec in "darwin-arm64:darwin:arm64:" "darwin-x64:darwin:amd64:" "windows-x64:windows:amd64:.exe"; do
            label="${spec%%:*}"; rest="${spec#*:}"
            goos="${rest%%:*}"; rest="${rest#*:}"
            goarch="${rest%%:*}"; ext="${rest#*:}"
            plat="darwin"; [ "$goos" = windows ] && plat="win32"

            work="bundle/$label"
            mkdir -p "$work/server"
            cp "dist/fmsg-mcp_${goos}_${goarch}${ext}" "$work/server/fmsg-mcp${ext}"
            cp img/icon.png "$work/icon.png"
            chmod +x "$work/server/"*

            sed -e "s/__VERSION__/${VERSION}/g" \
                -e "s/__EXT__/${ext}/g" \
                -e "s/__PLATFORM__/${plat}/g" \
                .github/mcpb-manifest.template.json > "$work/manifest.json"

            (cd "$work" && zip -qr "$GITHUB_WORKSPACE/dist/fmsg-${label}.mcpb" .)
          done
          ls -l dist/*.mcpb

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sign bundles only when the MCPB_SIGNING_* secrets hold a CA-issued
      # code-signing certificate. There is no self-signed fallback on purpose:
      # `mcpb verify` validates the chain against the OS trust store, so a
      # self-signed signature always verifies as "not signed" and fails the
      # build. Unsigned bundles are fine — directory listing, not signing, is
      # what removes Claude Desktop's install warnings.
      - name: Sign and verify Claude Desktop bundles
        env:
          MCPB_SIGNING_CERT: ${{ secrets.MCPB_SIGNING_CERT }}
          MCPB_SIGNING_KEY: ${{ secrets.MCPB_SIGNING_KEY }}
          MCPB_SIGNING_INTERMEDIATE: ${{ secrets.MCPB_SIGNING_INTERMEDIATE }}
        run: |
          set -euo pipefail
          if [ -z "${MCPB_SIGNING_CERT:-}" ]; then
            echo "MCPB_SIGNING_CERT not configured — publishing unsigned bundles"
            exit 0
          fi
          npm install -g @anthropic-ai/mcpb
          keydir=$(mktemp -d)
          printf '%s' "$MCPB_SIGNING_CERT" > "$keydir/cert.pem"
          printf '%s' "$MCPB_SIGNING_KEY" > "$keydir/key.pem"
          sign_args=(--cert "$keydir/cert.pem" --key "$keydir/key.pem")
          if [ -n "${MCPB_SIGNING_INTERMEDIATE:-}" ]; then
            printf '%s' "$MCPB_SIGNING_INTERMEDIATE" > "$keydir/intermediate.pem"
            sign_args+=(--intermediate "$keydir/intermediate.pem")
          fi
          for b in dist/*.mcpb; do
            mcpb sign "$b" "${sign_args[@]}"
            mcpb verify "$b"
          done

      # Checksums cover the final assets, so this must run after signing
      # (mcpb sign rewrites the bundles).
      - name: Generate checksums
        run: (cd dist && sha256sum fmsg-mcp_* *.mcpb > SHA256SUMS && cat SHA256SUMS)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/fmsg-mcp_* dist/*.mcpb dist/SHA256SUMS --clobber
